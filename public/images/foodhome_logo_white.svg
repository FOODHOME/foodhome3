<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Symbol: Korean Kimchi Pot & Fresh Radish Leaf Emblem -->
  <g transform="translate(4, 6)">
    <rect x="0" y="2" width="48" height="48" rx="14" fill="#B64346" />
    <!-- Kimchi / Radish Leaf Sprout -->
    <path d="M24 12C24 12 28 17 32 17C36 17 37 13 37 13C37 13 36 21 29 21C26 21 24 19 24 19V12Z" fill="#9FC27E" />
    <path d="M24 14C24 14 20 18 16 18C12 18 11 15 11 15C11 15 12 22 19 22C22 22 24 20 24 20V14Z" fill="#B8D69A" />
    <!-- Pot Rim and Body -->
    <path d="M14 24H34C37 24 38 26 37 29L34 40C33 43 31 44 28 44H20C17 44 15 43 14 40L11 29C10 26 11 24 14 24Z" fill="#FAF8F5" />
    <!-- Wave Accent -->
    <path d="M16 30C19 28 21 32 24 30C27 28 29 32 32 30" stroke="#872D35" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Typography: 푸드홈 (FOODHOME) White Version -->
  <g transform="translate(64, 10)">
    <!-- Korean Title "푸드홈" -->
    <text x="0" y="28" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="27" font-weight="900" fill="#FFFFFF" letter-spacing="-1.2">푸드홈</text>
    
    <!-- English & Category Subtitle -->
    <text x="1" y="44" font-family="'Pretendard', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#E8B4B8" letter-spacing="2.8">FOODHOME</text>
    
    <!-- Vertical Divider and Description -->
    <rect x="96" y="34" width="1.2" height="11" fill="#665353" />
    <text x="104" y="43.5" font-family="'Pretendard', -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#D3C9C4" letter-spacing="-0.2">보쌈무김치 전문기업</text>
  </g>
</svg>
